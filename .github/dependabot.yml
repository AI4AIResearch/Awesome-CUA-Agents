version: 2
updates:
  # "/" covers .github/workflows; "/automation" adds publish.yml. With directories, one grouped PR bumps both.
  - package-ecosystem: github-actions
    directories: ["/", "/automation"]
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
    labels: ["area:ci"]
  # requirements-dev.txt is pip-compile output from requirements-dev.in; Dependabot recompiles it with the hashes its header asks for.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    labels: ["area:ci"]
