name: Twice-daily discovery

on:
  schedule:
    - cron: '17 8,20 * * *'
      timezone: America/Los_Angeles
  workflow_dispatch:

permissions: {}

concurrency:
  group: catalog-discovery
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    outputs:
      pushed: ${{ steps.commit.outputs.pushed }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
      - run: python -m pip install -r requirements-dev.txt
      - name: Discover and verify public metadata
        run: python scripts/scan.py
      - name: Check generated data and review boundaries
        run: |
          python scripts/catalog.py validate
          python scripts/catalog.py build --check
          python -m unittest discover -s tests -v
          node --test tests/web.test.mjs
          python scripts/build_site.py
      - name: Commit verified scan output
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data docs README.md README.zh-CN.md
          git diff --cached --check
          # The checks above ran on the working tree; refuse a commit that would omit any of it.
          if ! git diff --quiet; then echo 'Tracked changes outside the committed paths:'; git diff --stat; exit 1; fi
          untracked=$(git ls-files --others --exclude-standard)
          if [ -n "$untracked" ]; then printf 'Untracked files outside the committed paths:\n%s\n' "$untracked"; exit 1; fi
          if ! git diff --cached --quiet; then
            git commit -m 'Update public-source scan and verified metadata'
            git push origin HEAD:main
            echo 'pushed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Retain scan evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: scan-evidence
          path: |
            data/scan-status.json
            data/recent-paper-search.json
            data/paper-discovery-status.json
            data/paper-discovery-queries.json
            data/research-discovery.json
            data/discovery-runs.json
            data/harvest-failures.jsonl
          retention-days: 30
  dispatch_quality:
    # Pushes made with GITHUB_TOKEN start no push workflows; dispatch is the documented exception.
    # Only this job, with no checkout, holds the actions permission; the scan, its dependencies and its persisted token never do.
    needs: scan
    if: needs.scan.outputs.pushed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Run Catalog quality on the scan commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run catalog.yml --ref main -R "$GITHUB_REPOSITORY"
