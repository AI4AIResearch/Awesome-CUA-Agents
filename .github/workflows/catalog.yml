name: Catalog quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Validate source-backed records
        run: python scripts/catalog.py validate
      - name: Check generated views before rebuilding
        run: python scripts/catalog.py build --check
      - name: Test ingestion and review safeguards
        run: python -m unittest discover -s tests -v
      - name: Build portable exports
        run: python scripts/catalog.py build
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: cua-catalog
          path: |
            dist/catalog.sqlite
            dist/catalog.json
            data/catalog.jsonl
            data/coverage.json
