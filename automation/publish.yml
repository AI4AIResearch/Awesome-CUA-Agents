name: Publish catalog website

on:
  push:
    branches: [main]
  schedule:
    - cron: '47 8,20 * * *'
      timezone: America/Los_Angeles
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-publication
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      source_commit: ${{ steps.source_revision.outputs.source_commit }}
    permissions:
      contents: write
      pages: read
    steps:
      - name: Check out website snapshot
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Check out public source catalog
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: reacher-z/Awesome-CUA
          ref: main
          path: .pipeline/source
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .pipeline/source/requirements-dev.txt
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: python -m pip install -r .pipeline/source/requirements-dev.txt
      - name: Validate source data and website behavior
        working-directory: .pipeline/source
        run: |
          python scripts/catalog.py validate
          python scripts/catalog.py build --check
          python -m unittest discover -s tests -v
          node --test tests/web.test.mjs
      - name: Build website from the verified catalog
        working-directory: .pipeline/source
        run: |
          python scripts/build_site.py
          python scripts/prepare_publication.py --site-dir "$GITHUB_WORKSPACE" --skip-profile
      - name: Record source revision
        id: source_revision
        run: |
          CUA_SOURCE_SHA=$(git -C .pipeline/source rev-parse HEAD)
          printf 'source_commit=%s\n' "$CUA_SOURCE_SHA" >> "$GITHUB_OUTPUT"
          CUA_SOURCE_SHA="$CUA_SOURCE_SHA" python - <<'PY'
          import json, os
          from pathlib import Path
          info={'source_repository':'https://github.com/reacher-z/Awesome-CUA','source_commit':os.environ['CUA_SOURCE_SHA'],'publication_run':f'https://github.com/{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{os.environ["GITHUB_RUN_ID"]}'}
          for target in [Path('data/build-info.json'),Path('.pipeline/source/dist/site/data/build-info.json')]:
              target.write_text(json.dumps(info,indent=2)+'\n')
          PY
          printf 'Source catalog commit: `%s`\n' "$CUA_SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Commit the public website snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh website from the verified source catalog'
            git push origin HEAD:main
          fi
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload verified site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .pipeline/source/dist/site
          include-hidden-files: true
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified static catalog
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
  notify_search:
    name: Notify search engines of published changes
    needs: [build, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out the published snapshot and accepted submission state
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
      - name: Check out the exact source used in this publication
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: reacher-z/Awesome-CUA
          ref: ${{ needs.build.outputs.source_commit }}
          path: .pipeline/source
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Notify IndexNow after live-site and ownership checks
        run: |
          python3 .pipeline/source/scripts/submit_indexnow.py --submit \
            --site-dir "$GITHUB_WORKSPACE" \
            --state .indexnow/state.json \
            --receipts .indexnow/submissions.json
      - name: Preserve accepted state and actual submission receipts
        if: always()
        run: |
          if [ -d .indexnow ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- .indexnow
            git diff --cached --check
            if ! git diff --cached --quiet; then
              git commit -m 'Record search notification outcome for the published catalog'
              git push origin HEAD:main
            fi
          fi
